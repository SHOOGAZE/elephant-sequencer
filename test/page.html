/* the module is added once per context, the node is made after that and wired to the three send buses (G.d.in, G.r.in, G.c.in) */
GR.attachFx=async function(G){
  const ctx=G.ctx;if(!ctx.audioWorklet||typeof AudioWorkletNode==='undefined')return false;
  try{
    if(!ctx._elefx)ctx._elefx=ctx.audioWorklet.addModule('data:text/javascript;base64,'+btoa(FX_WORKLET));
    await ctx._elefx;
    const n=new AudioWorkletNode(ctx,'elefx',{numberOfInputs:3,numberOfOutputs:1,outputChannelCount:[2],channelCount:2,channelCountMode:'explicit'});
    G.d.in.connect(n,0,0);G.r.in.connect(n,0,1);G.c.in.connect(n,0,2);n.connect(G.sum);G.fxn=n;return true;
  }catch(e){return false}

/* ---------- samples ---------- */
const Samples=GR.Samples={slots:[],MAX:64,rate:44100};
function mkBuffer(rate,chs){
  const b=new AudioBuffer({length:chs[0].length,numberOfChannels:chs.length,sampleRate:rate});
  chs.forEach((c,i)=>b.copyToChannel(c,i));
  return b;
}
Samples.add=function(name,chs,rate,user){
  if(Samples.slots.length>=Samples.MAX)return -1;
  const maxLen=Math.floor(rate*30);
  chs=chs.map(c=>c.length>maxLen?c.slice(0,maxLen):c);
  Samples.slots.push({name,rate,ch:chs,user:!!user,buf:null,rev:null});
  return Samples.slots.length-1;
};
Samples.buf=function(i,rev){
  const s=Samples.slots[i];if(!s)return null;
  if(!s.buf)s.buf=mkBuffer(s.rate,s.ch);

    if(!s.rev)s.rev=mkBuffer(s.rate,s.ch.map(c=>{const r=new Float32Array(c.length);for(let k=0;k<c.length;k++)r[c.length-1-k]=c[k];return r}));

Samples.replace=function(i,name,chs,rate){
  Samples.slots[i]={name,rate,ch:chs,user:true,buf:null,rev:null};
};
function norm(a,pk){let m=0;for(let i=0;i<a.length;i++)m=Math.max(m,Math.abs(a[i]));if(m>0){const g=(pk||.9)/m;for(let i=0;i<a.length;i++)a[i]*=g}return a}

/* ---------- project model ---------- */
function newStep(){return{on:0,note:0,vel:.8,micro:0,cond:0,len:1,rtg:1,lock:null}}
const MAXS=64;
/* pattern rows start at 16 steps and grow on demand up to 64, so old projects and saves stay small */
function growRow(row,len){while(row.length<len)row.push(newStep());return row}
function stepAt(row,len,pos){if(row.length<=pos)growRow(row,Math.min(MAXS,Math.max(len,pos+1)));return row[pos]}
function patLen(P){let m=16;for(const t of P.tracks)if(t.len>m)m=t.len;return Math.ceil(Math.min(MAXS,m)/16)*16}

function newTrack(engine,slot){return{engine,params:ENGINE_DEFAULT[engine](),slot:slot==null?-1:slot,mute:false,solo:false,len:16,sc:0}}
function defaultProject(){

function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}

  const enc=new TextEncoder(),parts=[],cds=[];let off=0;
  files.forEach(f=>{
    const nb=enc.encode(f.name),n=f.data.length,crc=crc32(f.data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,n,true);lh.setUint32(22,n,true);lh.setUint16(26,nb.length,true);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);ch.setUint32(20,n,true);ch.setUint32(24,n,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    parts.push(new Uint8Array(lh.buffer),nb,f.data);cds.push(new Uint8Array(ch.buffer),nb);
    off+=30+nb.length+n;
  });
  const cdSize=cds.reduce((a,p)=>a+p.length,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  const all=parts.concat(cds,[new Uint8Array(end.buffer)]),total=all.reduce((a,p)=>a+p.length,0),res=new Uint8Array(total);
  let o=0;all.forEach(p=>{res.set(p,o);o+=p.length});return res;
};
GR.zipStore=(name,data)=>GR.zipMulti([{name,data}]);
/* standard MIDI file of the current pattern, one track per groove track */
GR.midiFile=function(P,bars){
  const PPQ=96,ST=PPQ/4,bytes=[];
  const w32=v=>[v>>>24&255,v>>>16&255,v>>>8&255,v&255],w16=v=>[v>>8&255,v&255];
  const vlq=v=>{const o=[v&127];while((v>>=7)>0)o.unshift((v&127)|128);return o};
  const chunk=(id,d)=>[...id].map(c=>c.charCodeAt(0)).concat(w32(d.length),d);
  const trks=[];
  const mpq=Math.round(60e6/P.bpm);
  trks.push(chunk('MTrk',[0,255,81,3,mpq>>16&255,mpq>>8&255,mpq&255,0,255,3,P.name.length?Math.min(P.name.length,60):1,...(P.name||'g').slice(0,60).split('').map(c=>c.charCodeAt(0)&127),0,255,47,0]));
  const pat=P.patterns[P.pat];
  for(let ti=0;ti<NT;ti++){
    const tr=P.tracks[ti],ev=[],samp=true;
    for(let g=0;g<bars*16;g++){
      const pos=g%tr.len,st=stepAt(pat[ti],tr.len,pos);if(!st.on||!condPass(st.cond,Math.floor(g/tr.len),false))continue;
      const sw=(g&1)?P.swing*ST*4:0,t=Math.max(0,Math.round(g*ST+sw+st.micro/24*ST)),note=clamp((samp?60:48)+st.note,0,127),vel=Math.max(1,Math.round(clamp(st.vel,0,1)*127)),len=Math.max(2,Math.round(st.len*ST*.9));
      ev.push([t,1,note,vel]);ev.push([t+len,0,note,0]);
    }
    if(!ev.length)continue;
    ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    const nm=('T'+(ti+1)+' '+tr.engine).split('').map(c=>c.charCodeAt(0));
    const d=[0,255,3,nm.length,...nm];let last=0;
    ev.forEach(x=>{d.push(...vlq(x[0]-last),(x[1]?0x90:0x80)|(ti&15),x[2],x[3]);last=x[0]});
    d.push(0,255,47,0);trks.push(chunk('MTrk',d));
  }
  const head=chunk('MThd',[...w16(1),...w16(trks.length),...w16(PPQ)]);
  return Uint8Array.from(head.concat(...trks));
};

/* ---------- storage ---------- */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('elephant',1);r.onupgradeneeded=()=>r.result.createObjectStore('projects',{keyPath:'name'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
/* sample signature: lets the autosave skip rewriting unchanged samples */
function smpSig(){
  return Samples.slots.map((s,i)=>{
    if(!s.user)return '';
    const c=s.ch[0],n=c.length;let h=0;
    for(let k=0;k<64;k++)h+=c[Math.floor(k*(n-1)/63)]*(k+1);
    return i+'|'+s.name+'|'+n+'|'+s.ch.length+'|'+s.rate+'|'+Math.round(h*1e4)+'|'+(GR.smpRev||0);
  }).join(';');
}
const userSamples=()=>Samples.slots.map((s,i)=>s.user?{i,name:s.name,key:s.key,rate:s.rate,ch:s.ch.map(c=>c.buffer.slice(0))}:null).filter(Boolean);
function putRec(db,recs){return new Promise((res,rej)=>{const tx=db.transaction('projects','readwrite'),os=tx.objectStore('projects');recs.forEach(r=>os.put(r));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
GR.store={
  async put(name){
    const db=await idb(),P=GR.serialize(GR.proj);P.name=name==='__auto__'?GR.proj.name:name;
    const bc=Samples.slots.filter(s=>!s.user).length;
    if(name==='__auto__'){
      const sig=smpSig(),rec={name,json:P,smpRef:'__auto_smp__',builtinCount:bc,updated:Date.now()};
      if(sig===GR._smpSig)return putRec(db,[rec]);
      await putRec(db,[{name:'__auto_smp__',samples:userSamples(),updated:Date.now()},rec]);
      GR._smpSig=sig;return;
    }
    return putRec(db,[{name,json:P,samples:userSamples(),builtinCount:bc,updated:Date.now()}]);
  },
  async get(name){const db=await idb();return new Promise((res,rej)=>{const r=db.transaction('projects').objectStore('projects').get(name);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async list(){const db=await idb();return new Promise((res,rej)=>{const r=db.transaction('projects').objectStore('projects').getAll();r.onsuccess=()=>res(r.result.filter(x=>x.name.slice(0,2)!=='__').map(x=>({name:x.name,updated:x.updated})).sort((a,b)=>b.updated-a.updated));r.onerror=()=>rej(r.error)})},
  async del(name){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('projects','readwrite');tx.objectStore('projects').delete(name);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})},
  async load(name){
    const rec=await GR.store.get(name);if(!rec)return false;
    let smp=rec.samples;
    if(!smp&&rec.smpRef){const r2=await GR.store.get(rec.smpRef);smp=r2&&r2.samples||[]}
    GR.placeSamples(smp||[]);
    GR.proj=GR.revive(rec.json);
    if(name==='__auto__')GR._smpSig=smpSig();
    return true;
  }
};
GR.placeSamples=function(list){
  Samples.builtin();
  list.forEach(s=>{const slot={name:s.name,rate:s.rate,ch:s.ch.map(b=>new Float32Array(b)),key:s.key,user:true,buf:null,rev:null};
    while(Samples.slots.length<s.i)Samples.slots.push({name:'-',rate:Samples.rate,ch:[new Float32Array(1)],user:false,buf:null,rev:null});
    Samples.slots[s.i]=slot});
};
/* one-file project: pattern data plus the user's samples (16 bit) */
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x6000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x6000));return btoa(s)};
const unb64=t=>{const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
GR.packProject=function(){
  const smp=Samples.slots.map((s,i)=>s.user?{i,name:s.name,key:s.key,rate:s.rate,ch:s.ch.map(c=>{const q=new Int16Array(c.length);for(let k=0;k<c.length;k++)q[k]=Math.max(-32768,Math.min(32767,Math.round(c[k]*32767)));return b64(new Uint8Array(q.buffer))})}:null).filter(Boolean);
  return JSON.stringify({elephant:1,project:GR.serialize(GR.proj),samples:smp});
};
GR.unpackProject=function(text){
  const o=JSON.parse(text);
  if(o&&o.elephant&&o.project){
    GR.placeSamples((o.samples||[]).map(s=>({i:s.i,name:s.name,key:s.key,rate:s.rate,ch:s.ch.map(t=>{const u=unb64(t),q=new Int16Array(u.buffer,0,u.length>>1),f=new Float32Array(q.length);for(let k=0;k<q.length;k++)f[k]=q[k]/32767;return f.buffer})})));
    GR.proj=GR.revive(o.project);return 'full';
  }
  if(o&&o.tracks&&o.patterns){GR.proj=GR.revive(o);return 'pattern'}
  throw new Error('not an ELEPHANT file');
};

/* multi-touch: taps on buttons must still count while another finger holds a key, pad or slider */
(()=>{
  const act=new Set(),info=new Map();let sup=null;
  const btn=t=>t&&t.closest?t.closest('button,.chip'):null;
  document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;act.add(e.pointerId);info.set(e.pointerId,{b:btn(e.target),x:e.clientX,y:e.clientY,t:performance.now(),multi:act.size>1})},true);
  const drop=e=>{act.delete(e.pointerId);info.delete(e.pointerId)};
  document.addEventListener('pointercancel',drop,true);
  document.addEventListener('pointerup',e=>{
    if(e.pointerType!=='touch')return;const i=info.get(e.pointerId),multi=i&&(i.multi||act.size>1);drop(e);
    if(!i||!i.b||!multi||i.b.disabled)return;
    if(Math.hypot(e.clientX-i.x,e.clientY-i.y)>14||performance.now()-i.t>700)return;
    if(btn(document.elementFromPoint(e.clientX,e.clientY))!==i.b)return;
    sup={t:performance.now(),x:e.clientX,y:e.clientY};i.b.click();
  },true);
  document.addEventListener('click',e=>{if(!sup||!e.isTrusted)return;const s0=sup;if(performance.now()-s0.t>500){sup=null;return}if(Math.hypot(e.clientX-s0.x,e.clientY-s0.y)<=16){sup=null;e.stopPropagation();e.preventDefault()}},true);
  document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
})();
